columns:
  id: "Group"
  name: "Name"
  organization: "Organization"
  position: "Position"
  time_signed_in: "Time Signed In"

time:
  timezone: "America/Los_Angeles"
  floor: "minute"
  off_hours_start: 0
  off_hours_end: 5

windows:
  minute_series_smooth: 15
  swing_window_minutes: 60
  scan_window_minutes: [5, 15, 60, 240]
  analysis_bucket_minutes: [1, 5, 15, 30, 60, 120]

thresholds:
  top_duplicate_names: 200
  burst_fdr_alpha: 0.01
  procon_swing_fdr_alpha: 0.01
  near_dup_max_candidates_per_block: 5000
  near_dup_similarity_threshold: 92
  swing_min_window_total: 25

calibration:
  enabled: true
  mode: "hour_of_day"
  significance_policy: "parametric_fdr"
  iterations: 50
  random_seed: 42
  support_alpha: 0.1

changepoints:
  enabled: true
  min_segment_minutes: 30
  penalty_scale: 3.0

periodicity:
  enabled: true
  max_lag_minutes: 180
  min_period_minutes: 5.0
  max_period_minutes: 720.0
  top_n_periods: 20
  calibration_iterations: 100
  random_seed: 42
  fdr_alpha: 0.05

names:
  strip_punctuation: true
  normalize_unicode: true
  nickname_map_path: "configs/nicknames.csv"
  phonetic: "double_metaphone"

name_analysis:
  primary_name_key: "medium"
  sensitivity_name_keys: ["strict", "nickname"]
  collision_metrics: ["repeated_group_rows", "excess_rows", "pairs"]
  collision_primary_metric: "repeated_group_rows"
  collision_key_mode: "strict"
  collision_baseline_source: "vrdb_full_histogram"
  collision_baseline_model: "multinomial"
  collision_uncertainty_mode: "monte_carlo"
  collision_scope_primary: "full_hearing"
  collision_scope_overlays: []
  collision_baseline_failure_policy: "fail"
  collision_stratification: "none"
  per_name_significance_model: "binomial_tail"
  per_name_display_limit: 1000
  exclude_non_person_from_inference: true
  monte_carlo_draws: 20000
  position_permutation_draws: 10000
  temporal_permutation_draws: 5000
  bh_fdr_q: 0.10
  low_power_min_unique_names: 25
  low_power_min_expected_duplicates: 5.0
  max_per_name_rows: 1000

rarity:
  enabled: false
  first_name_frequency_path:
  last_name_frequency_path:
  epsilon: 1.0e-9

input:
  mode: "postgres"
  db_url:
  submissions_table: "public_submissions"
  source_file:
  hearing_metadata_path:

voter_registry:
  enabled: true
  db_url:
  table_name: "voter_registry"
  active_only: true
  match_bucket_minutes: 30
  primary_match_mode: "conservative"
  strong_fuzzy_min_score: 92.0
  weak_fuzzy_min_score: 84.0
  ambiguous_score_gap: 2.0
  pairwise_alpha: 0.05

report:
  min_cell_n_for_rates: 25
  default_dedup_mode: "side_by_side"

off_hours:
  bucket_minutes:
  min_window_total: 25
  fdr_alpha: 0.05
  primary_bucket_minutes: 30
  model_min_rows: 24
  model_hour_harmonics: 3
  alert_off_hours_min_fraction: 1.0
  primary_alert_min_abs_delta: 0.03

outputs:
  tables_format: "parquet"
  figures_format: "png"
  interactive_plotly: false
