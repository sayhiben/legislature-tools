<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Legislature Tools Reports</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/tabulator-tables@6.3.0/dist/css/tabulator.min.css"
    >
    <style>
      :root {
        color-scheme: light;
        --bg: #edf2f7;
        --surface: #ffffff;
        --ink: #1b2a3a;
        --muted: #58697d;
        --border: #d3dce8;
        --accent: #1f4f82;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "Avenir Next", "Segoe UI", sans-serif;
        font-size: 14px;
        line-height: 1.35;
        color: var(--ink);
        background: linear-gradient(180deg, #f8fbff 0%, var(--bg) 100%);
      }
      main {
        max-width: 1500px;
        margin: 0 auto;
        padding: 2rem 1rem 3rem;
      }
      header {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 1rem 1.25rem;
      }
      h1 {
        margin: 0 0 0.35rem 0;
        font-size: 1.45rem;
      }
      .subtitle {
        margin: 0;
        color: var(--muted);
        font-size: 0.92rem;
      }
      .controls {
        margin-top: 1rem;
        display: grid;
        gap: 0.6rem;
      }
      .controls label {
        color: var(--muted);
        font-size: 0.84rem;
      }
      .search-input {
        width: min(560px, 100%);
        border: 1px solid var(--border);
        border-radius: 8px;
        font-size: 0.9rem;
        padding: 0.62rem 0.72rem;
      }
      .search-input:focus {
        outline: 2px solid color-mix(in srgb, var(--accent) 35%, white);
        outline-offset: 1px;
      }
      .helper {
        margin: 0;
        color: var(--muted);
        font-size: 0.84rem;
      }
      .table-shell {
        margin-top: 0.9rem;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 0.75rem;
      }
      .stats {
        margin-top: 0.6rem;
        color: var(--muted);
        font-size: 0.82rem;
      }
      .tabulator {
        border: none;
        background: transparent;
        font-size: 0.86rem;
      }
      .tabulator .tabulator-header {
        border-bottom: 1px solid var(--border);
      }
      .tabulator .tabulator-header .tabulator-col {
        background: #f8fbff;
        border-right: 1px solid var(--border);
      }
      .tabulator .tabulator-header .tabulator-col .tabulator-col-title {
        font-size: 0.82rem;
      }
      .tabulator .tabulator-row .tabulator-cell {
        border-right: 1px solid #e9eff8;
      }
      .tabulator .tabulator-cell {
        padding: 6px 8px;
      }
      .tabulator .tabulator-footer {
        border-top: 1px solid var(--border);
        font-size: 0.8rem;
      }
      .tabulator .tabulator-responsive-collapse table {
        font-size: 0.8rem;
      }
      .tabulator .tabulator-responsive-collapse table td {
        padding: 4px 6px;
      }
      .report-link {
        color: var(--accent);
        text-decoration: none;
        font-weight: 600;
      }
      .report-link:hover {
        text-decoration: underline;
      }
      .empty {
        margin-top: 1rem;
        background: var(--surface);
        border: 1px dashed var(--border);
        border-radius: 12px;
        padding: 1rem;
      }
      @media (max-width: 900px) {
        main {
          padding: 1rem 0.6rem 2rem;
        }
        header {
          padding: 0.8rem 0.9rem;
        }
        h1 {
          font-size: 1.26rem;
        }
        .table-shell {
          padding: 0.45rem;
        }
        .tabulator .tabulator-header .tabulator-col {
          min-height: 42px;
        }
        .tabulator .tabulator-header .tabulator-col .tabulator-col-title {
          white-space: normal;
          line-height: 1.12;
        }
      }
      @media (max-width: 640px) {
        body {
          font-size: 13px;
        }
        .search-input {
          width: 100%;
          font-size: 0.86rem;
          padding: 0.55rem 0.62rem;
        }
        .tabulator {
          font-size: 0.8rem;
        }
        .tabulator .tabulator-cell {
          padding: 5px 6px;
        }
        .tabulator .tabulator-header .tabulator-col .tabulator-col-title {
          font-size: 0.75rem;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Legislature Tools Reports</h1>
        <p class="subtitle">Generated index: Feb 24, 2026 12:20 PM PST</p>
      </header>
      <section class="controls">  <label for="report-search">Global filter</label>  <input id="report-search" class="search-input" type="search"     placeholder="Filter by bill, description, or date/time">  <p class="helper">Tip: headers are sortable and each column has its own filter input.</p></section><section class="table-shell">  <div id="reports-table"></div>  <p id="table-stats" class="stats"></p></section>
    </main>
    <script src="https://unpkg.com/tabulator-tables@6.3.0/dist/js/tabulator.min.js"></script>
    <script>
      const tableRows = [{"report_id": "SB6346-20260206-1330", "report_href": "./SB6346-20260206-1330/report.html", "report_label": "SB 6346", "bill_description": "SB 6346 Tax on millionaires", "meeting_local": "Feb 6, 2026 1:30 PM PST", "meeting_epoch": 1770413400, "generated_local": "Feb 24, 2026 12:20 PM PST", "generated_epoch": 1771964403, "total_testifiers": 80847, "pro_pct": 23.705270449119944, "con_pct": 75.89520946973913}, {"report_id": "SB5798-20250331-1600", "report_href": "./SB5798-20250331-1600/report.html", "report_label": "SB 5798", "bill_description": "SB 5798 Property tax", "meeting_local": "Mar 31, 2025 4:00 PM PDT", "meeting_epoch": 1743462000, "generated_local": "Feb 24, 2026 12:16 PM PST", "generated_epoch": 1771964219, "total_testifiers": 45482, "pro_pct": 4.766720900576052, "con_pct": 94.87929290708412}, {"report_id": "HB2289-20260223-1600", "report_href": "./HB2289-20260223-1600/report.html", "report_label": "HB 2289", "bill_description": "PSHB 2289 - Making 2025-2027 fiscal biennium supplemental operating appropriations. (Remote Testimony Available).", "meeting_local": "Feb 23, 2026 4:00 PM PST", "meeting_epoch": 1771891200, "generated_local": "Feb 24, 2026 12:14 PM PST", "generated_epoch": 1771964099, "total_testifiers": 3391, "pro_pct": 2.0347979946918313, "con_pct": 92.24417575936302}, {"report_id": "ESSB6346-20260224-0800", "report_href": "./ESSB6346-20260224-0800/report.html", "report_label": "ESSB 6346", "bill_description": "ESSB 6346 Tax on millionaires", "meeting_local": "Feb 24, 2026 8:00 AM PST", "meeting_epoch": 1771948800, "generated_local": "Feb 24, 2026 12:14 PM PST", "generated_epoch": 1771964067, "total_testifiers": 129971, "pro_pct": 9.774488155049973, "con_pct": 89.92313669972532}, {"report_id": "2ESSB5268-20260218-1030", "report_href": "./2ESSB5268-20260218-1030/report.html", "report_label": "2ESSB 5268", "bill_description": "2ESSB 5268 Unlawful firearm possession", "meeting_local": "Feb 18, 2026 10:30 AM PST", "meeting_epoch": 1771439400, "generated_local": "Feb 24, 2026 12:09 PM PST", "generated_epoch": 1771963796, "total_testifiers": 220, "pro_pct": 95.45454545454545, "con_pct": 4.545454545454546}];
      const tableElement = document.getElementById("reports-table");
      const tableStats = document.getElementById("table-stats");
      const globalSearchInput = document.getElementById("report-search");

      if (tableElement && typeof window.Tabulator !== "undefined") {
        const isMobile = window.matchMedia("(max-width: 700px)").matches;
        const asLink = (href, label) => {
          if (!href) {
            return "<span>-</span>";
          }
          const anchor = document.createElement("a");
          anchor.className = "report-link";
          anchor.href = String(href);
          anchor.textContent = String(label);
          return anchor.outerHTML;
        };

        const formatInt = (value) => {
          const numeric = Number(value);
          if (!Number.isFinite(numeric)) {
            return "-";
          }
          return new Intl.NumberFormat("en-US").format(Math.trunc(numeric));
        };

        const formatPct = (value) => {
          const numeric = Number(value);
          if (!Number.isFinite(numeric)) {
            return "-";
          }
          return `${numeric.toFixed(1)}%`;
        };

        const sortEpoch = (a, b) => {
          const aRaw = Number(a);
          const bRaw = Number(b);
          const aEpoch = Number.isFinite(aRaw) ? aRaw : Number.NEGATIVE_INFINITY;
          const bEpoch = Number.isFinite(bRaw) ? bRaw : Number.NEGATIVE_INFINITY;
          return aEpoch - bEpoch;
        };

        const matchesDisplayText = (headerValue, rowData, displayField) => {
          const needle = String(headerValue || "").trim().toLowerCase();
          if (!needle) {
            return true;
          }
          return String(rowData?.[displayField] || "").toLowerCase().includes(needle);
        };

        const toPlainText = (value) => {
          if (value === null || value === undefined) {
            return "";
          }
          if (typeof value === "string") {
            const parser = document.createElement("div");
            parser.innerHTML = value;
            return (parser.textContent || "").trim();
          }
          if (value instanceof Node) {
            return (value.textContent || "").trim();
          }
          return String(value).trim();
        };

        const renderResponsiveCollapse = (items) => {
          const table = document.createElement("table");
          const seen = new Set();

          for (const item of items || []) {
            const title = String(item?.title || "").trim();
            const valueText = toPlainText(item?.value);
            if (!title || title === "Details") {
              continue;
            }
            const key = `${title}::${valueText}`;
            if (seen.has(key)) {
              continue;
            }
            seen.add(key);

            const row = document.createElement("tr");
            const titleCell = document.createElement("td");
            const strong = document.createElement("strong");
            strong.textContent = title;
            titleCell.appendChild(strong);

            const valueCell = document.createElement("td");
            valueCell.textContent = valueText;

            row.appendChild(titleCell);
            row.appendChild(valueCell);
            table.appendChild(row);
          }

          return table;
        };

        const table = new window.Tabulator(tableElement, {
          data: tableRows,
          layout: "fitColumns",
          responsiveLayout: isMobile ? "collapse" : false,
          responsiveLayoutCollapseStartOpen: false,
          responsiveLayoutCollapseUseFormatters: true,
          responsiveLayoutCollapseFormatter: renderResponsiveCollapse,
          pagination: "local",
          paginationSize: isMobile ? 10 : 25,
          paginationSizeSelector: [10, 25, 50, 100],
          initialSort: [{ column: "meeting_epoch", dir: "desc" }],
          columns: [
            {
              title: "Report",
              field: "report_label",
              minWidth: 150,
              headerFilter: "input",
              formatter: (cell) => {
                const row = cell.getRow().getData();
                return asLink(row.report_href, row.report_label || row.report_id);
              },
            },
            {
              title: "Bill Description",
              field: "bill_description",
              minWidth: 420,
              headerFilter: "input",
              formatter: (cell) => {
                const value = String(cell.getValue() || "-");
                return `<span title="${value}">${value}</span>`;
              },
            },
            {
              title: "Total Testifiers",
              field: "total_testifiers",
              hozAlign: "right",
              width: 150,
              sorter: "number",
              headerFilter: "number",
              formatter: (cell) => formatInt(cell.getValue()),
            },
            {
              title: "Pro %",
              field: "pro_pct",
              hozAlign: "right",
              width: 95,
              sorter: "number",
              headerFilter: "number",
              formatter: (cell) => formatPct(cell.getValue()),
            },
            {
              title: "Con %",
              field: "con_pct",
              hozAlign: "right",
              width: 95,
              sorter: "number",
              headerFilter: "number",
              formatter: (cell) => formatPct(cell.getValue()),
            },
            {
              title: "Meeting Datetime (PT)",
              field: "meeting_epoch",
              minWidth: 210,
              headerFilter: "input",
              headerFilterFunc: (headerValue, _rowValue, rowData) =>
                matchesDisplayText(headerValue, rowData, "meeting_local"),
              sorter: sortEpoch,
              formatter: (cell) => String(cell.getRow().getData().meeting_local || "—"),
            },
            {
              title: "Last Updated (PT)",
              field: "generated_epoch",
              minWidth: 210,
              headerFilter: "input",
              headerFilterFunc: (headerValue, _rowValue, rowData) =>
                matchesDisplayText(headerValue, rowData, "generated_local"),
              sorter: sortEpoch,
              formatter: (cell) => String(cell.getRow().getData().generated_local || "—"),
            },
            ...(isMobile ? [{
              title: "Details",
              field: "__details_toggle",
              formatter: "responsiveCollapse",
              width: 86,
              minWidth: 86,
              hozAlign: "center",
              headerHozAlign: "center",
              headerSort: false,
              resizable: false,
              headerFilter: false,
            }] : []),
          ],
        });

        const updateStats = () => {
          if (!tableStats) {
            return;
          }
          const shown = typeof table.getDataCount === "function"
            ? table.getDataCount("active")
            : table.getRows("active").length;
          const total = tableRows.length;
          tableStats.textContent = `Showing ${shown} of ${total} reports`;
        };

        table.on("tableBuilt", updateStats);
        table.on("dataLoaded", updateStats);
        table.on("dataFiltered", updateStats);
        table.on("pageLoaded", updateStats);
        table.on("renderComplete", updateStats);
        window.requestAnimationFrame(updateStats);

        if (globalSearchInput) {
          globalSearchInput.addEventListener("input", (event) => {
            const needle = String(event.target.value || "").trim().toLowerCase();
            if (!needle) {
              table.clearFilter();
              updateStats();
              return;
            }
            table.setFilter((rowData) => {
              return (
                String(rowData.report_label || "").toLowerCase().includes(needle)
                || String(rowData.bill_description || "").toLowerCase().includes(needle)
                || String(rowData.meeting_local || "").toLowerCase().includes(needle)
                || String(rowData.generated_local || "").toLowerCase().includes(needle)
              );
            });
            updateStats();
          });
        }
      }
    </script>
  </body>
</html>
